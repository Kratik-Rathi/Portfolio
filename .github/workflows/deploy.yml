name: CI/CD — Test, Build and Deploy

on:
  push:
    branches:
      - source

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3 — Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4 — Run tests (pipeline stops here if any test fails)
      - name: Run tests
        run: npm run test

      # Step 5 — Build (only runs if tests passed)
      - name: Build
        run: npm run build

      # Step 6 — Deploy to master (only runs if build succeeded)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: master
          